<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z91NBQ868E"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Z91NBQ868E');
    </script>

    <title>Blue Banner Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for the chat interface */
        body {
            font-family: 'Inter', sans-serif;
            /* A subtle gradient background similar to modern chat UIs */
            background: linear-gradient(180deg, #f3f4f6 0%, #e5e7eb 100%);
        }
        /* Style for the scrollbar in the chat window */
        #chat-window::-webkit-scrollbar {
            width: 6px;
        }
        #chat-window::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        .chat-bubble-ai {
            background-color: #f1f5f9; /* Lighter gray for AI responses */
            color: #1e293b;
        }
        .chat-bubble-user {
            background-color: #2563eb; /* A slightly softer blue */
            color: #ffffff;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen">

    <div class="flex flex-col w-full max-w-3xl h-full bg-white/70 backdrop-blur-sm border border-slate-200/50 rounded-xl shadow-2xl">
        <header class="p-4 border-b border-slate-200/50 flex items-center justify-between">
            <div class="flex items-center">
                <div>
                    <h1 class="text-lg font-semibold text-slate-800">Blue Banner Bot</h1>
                    <!-- New "About" button -->
                    <a href="https://github.com/asherbolotski/BlueBannerBot/blob/main/README.md" class="ml-4 text-sm font-medium text-slate-600 hover:underline">About</a>
                </div>
            </div>
        
            <a href="https://www.paypal.com/paypalme/asherbolotski" target="_blank" rel="noopener noreferrer" class="bg-blue-50 text-blue-700 rounded-lg px-3 py-1.5 text-sm font-medium hover:bg-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors">
                Donate
            </a>
        </header>
        

        <main id="chat-window" class="flex-1 p-6 overflow-y-auto">
            <div class="flex mb-4">
            </div>
        </main>

        <footer class="p-4 bg-white/50 flex justify-between items-center">
            <div class="relative w-full mr-2">
                <input type="text" id="user-input" placeholder="Ask a question..." class="w-full p-4 pr-14 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition shadow-sm">
                <button id="send-btn" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:bg-slate-400 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </div>
            <button id="feedback-btn" class="bg-slate-200 text-slate-700 rounded-xl px-4 py-2 hover:bg-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-400 transition">
                Feedback
            </button>
        </footer>
    </div>

    <div id="feedback-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
            <h2 class="text-lg font-semibold mb-4">Submit Feedback</h2>
            <textarea id="feedback-input" class="w-full h-32 p-3 border rounded-md resize-none focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Type your feedback here..."></textarea>
            <div class="mt-4 flex justify-end space-x-2">
                <button id="cancel-feedback-btn" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-md hover:bg-slate-300">Cancel</button>
                <button id="submit-feedback-btn" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Submit</button>
            </div>
        </div>
    </div>

    <div id="feedback-toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 bg-green-500 text-white rounded-full shadow-lg hidden">
        Feedback submitted! Thank you.
    </div>

    <script>
        // --- JavaScript Logic ---
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const API_URL = "https://bluebannerbot-backend-156059279653.us-central1.run.app"; 

        const feedbackBtn = document.getElementById('feedback-btn');
        const feedbackModal = document.getElementById('feedback-modal');
        const feedbackInput = document.getElementById('feedback-input');
        const cancelFeedbackBtn = document.getElementById('cancel-feedback-btn');
        const submitFeedbackBtn = document.getElementById('submit-feedback-btn');
        const feedbackToast = document.getElementById('feedback-toast');

        let chatHistory = [];
        const HISTORY_LIMIT = 10;

        function addMessage(message, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex mb-4 ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const messageBubble = document.createElement('div');
            messageBubble.className = `p-3 rounded-xl max-w-lg shadow-sm ${sender === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai'}`;
            messageBubble.innerHTML = `<p>${message}</p>`;
            
            messageDiv.appendChild(messageBubble);
            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            const role = (sender === 'user') ? 'user' : 'assistant';
            chatHistory.push({ "role": role, "content": message.replace(/<br>/g, '\n') });
        }

        function showLoadingIndicator() {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loading-indicator';
            loadingDiv.className = 'flex mb-4 justify-start';
            const loadingBubble = document.createElement('div');
            loadingBubble.className = 'chat-bubble-ai p-3 rounded-xl max-w-lg';
            loadingBubble.innerHTML = `<div class="flex items-center space-x-2"><div class="w-2 h-2 bg-slate-500 rounded-full animate-pulse" style="animation-delay: 0s;"></div><div class="w-2 h-2 bg-slate-500 rounded-full animate-pulse" style="animation-delay: 0.2s;"></div><div class="w-2 h-2 bg-slate-500 rounded-full animate-pulse" style="animation-delay: 0.4s;"></div></div>`;
            loadingDiv.appendChild(loadingBubble);
            chatWindow.appendChild(loadingDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function hideLoadingIndicator() {
            const indicator = document.getElementById('loading-indicator');
            if (indicator) indicator.remove();
        }

        async function handleSendMessage() {
            const question = userInput.value.trim();
            if (!question) return;

            addMessage(question, 'user');
            userInput.value = '';
            sendBtn.disabled = true;

            showLoadingIndicator();

            try {
                if (chatHistory.length > HISTORY_LIMIT) {
                    console.log("History length exceeds limit, summarizing...");
                    const summaryResponse = await fetch(`${API_URL}/summarize`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ history: chatHistory }),
                    });

                    if (summaryResponse.ok) {
                        const data = await summaryResponse.json();
                        const summary = data.summary;
                        
                        const lastFewMessages = chatHistory.slice(-4);
                        chatHistory = [{ "role": "system", "content": `Summary of conversation so far: ${summary}` }];
                        chatHistory.push(...lastFewMessages);
                        console.log("History summarized successfully.");
                    } else {
                        console.error("Failed to summarize history.");
                    }
                }

                const response = await fetch(`${API_URL}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        question: question,
                        history: chatHistory.slice(0, -1)
                    }),
                });

                hideLoadingIndicator();

                if (!response.ok) {
                    addMessage("Sorry, I encountered an error. Please check the backend server's terminal for details.", 'ai');
                    chatHistory.pop(); 
                    return;
                }

                const data = await response.json();
                const formattedAnswer = data.answer.replace(/\n/g, '<br>');
                addMessage(formattedAnswer, 'ai');

            } catch (error) {
                hideLoadingIndicator();
                addMessage("I couldn't connect to my brain. Is the backend server running?", 'ai');
                chatHistory.pop();
                console.error("Error fetching AI response:", error);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') handleSendMessage();
        });

        // Feedback Modal Event Listeners
        feedbackBtn.addEventListener('click', () => {
            feedbackModal.style.display = 'flex';
        });

        cancelFeedbackBtn.addEventListener('click', () => {
            feedbackModal.style.display = 'none';
            feedbackInput.value = '';
        });

        submitFeedbackBtn.addEventListener('click', async () => {
            const feedbackMessage = feedbackInput.value.trim();
            if (!feedbackMessage) return;

            try {
                const response = await fetch(`${API_URL}/feedback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: feedbackMessage }),
                });

                if (response.ok) {
                    feedbackToast.style.display = 'block';
                    setTimeout(() => {
                        feedbackToast.style.display = 'none';
                    }, 3000);
                } else {
                    console.error("Failed to submit feedback.");
                    alert("Failed to submit feedback. Please try again later.");
                }
            } catch (error) {
                console.error("Error submitting feedback:", error);
                alert("An error occurred. Please check the console.");
            } finally {
                feedbackModal.style.display = 'none';
                feedbackInput.value = '';
            }
        });

    </script>
</body>
</html>
